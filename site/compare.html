<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agents Bridge · Dark vs light</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #27272a; color: #fafafa; font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; height: calc(100vh - 44px); box-sizing: border-box; }
    figure { margin: 0; display: grid; grid-template-rows: auto 1fr; gap: 6px; min-height: 0; }
    figcaption { color: #a1a1aa; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #fff; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } iframe { height: 80vh; } }
  </style>
</head>
<body>
  <header><strong>Agents Bridge · dark vs light</strong><span>Scroll each side on its own; move the mouse over the field.</span></header>
  <main>
    <figure><figcaption>Dark</figcaption><iframe src="index.html?theme=dark" title="Dark version"></iframe></figure>
    <figure><figcaption>Light</figcaption><iframe src="index.html?theme=light" title="Light version"></iframe></figure>
  </main>
</body>
</html>
