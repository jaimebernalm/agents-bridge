name: CI

on:
  push:
    branches: [main, feature/phase-5-pilot-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/agents-bridge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile
      - run: cd ui && bun install --frozen-lockfile
      - run: cd ui && bunx tsc --noEmit
      - run: bun run check
      - run: bun test

      # dist/ is committed and both apps install the plugins from the branch, so a bundle that
      # lags src/ ships stale code with no error anywhere. The bundles stay unminified so anyone
      # can read what runs, and this check shows it is exactly what src/ builds to.
      - name: Committed bundles match src
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          bun run build
          git diff --exit-code -- dist panel-dist ../agents-bridge-claude/dist ../agents-bridge-claude/panel-dist ../agents-bridge-claude/skills ../agents-bridge-claude/scripts || {
            echo "::error::dist is stale. Run 'bun run build' and commit the result."
            exit 1
          }

      - name: Bundled MCP and receiver suite
        run: UDS_MCP_TEST_ENTRYPOINT="$PWD/dist/server.js" UDS_HOOK_TEST_ENTRYPOINT="$PWD/dist/hook.js" bun test
